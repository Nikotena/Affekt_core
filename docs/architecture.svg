<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Affekt Core architecture</title>
  <desc id="d">Player text flows through a deterministic core (intent parser, vectorial personality, memory and world graph, context payload) and then to Gemma-4-31B-IT on AMD Token Factory, which phrases the NPC line. If the API is down, a canned line for the NPC's mood is used.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>

  <!-- containers first, so arrows are drawn on top -->
  <rect x="30" y="92" width="900" height="214" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="48" y="292" font-size="14" font-weight="600" fill="#1d4ed8">DETERMINISTIC CORE · 80% · plain Python, no model, same answer every time</text>

  <rect x="650" y="342" width="280" height="154" rx="14" fill="#fff1f2" stroke="#e11d2e" stroke-width="2"/>
  <text x="668" y="366" font-size="14" font-weight="600" fill="#be123c">LANGUAGE MODEL · 20%</text>

  <!-- player input -->
  <rect x="50" y="24" width="190" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="145" y="51" font-size="15" text-anchor="middle" fill="#0f172a">Player text</text>

  <!-- core components -->
  <rect x="50" y="150" width="190" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="145" y="176" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">Intent parser</text>
  <text x="145" y="198" font-size="12.5" text-anchor="middle" fill="#334155">intent · tone · price · item</text>
  <text x="145" y="226" font-size="12" text-anchor="middle" fill="#475569">optional: the model labels</text>
  <text x="145" y="242" font-size="12" text-anchor="middle" fill="#475569">lines the rules can't read</text>

  <rect x="270" y="150" width="190" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="365" y="176" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">Vectorial personality</text>
  <text x="365" y="198" font-size="12.5" text-anchor="middle" fill="#334155">4D emotional state per NPC</text>
  <text x="365" y="226" font-size="12" text-anchor="middle" fill="#475569">temperament sets how fast it</text>
  <text x="365" y="242" font-size="12" text-anchor="middle" fill="#475569">angers, calms or holds a grudge</text>

  <rect x="490" y="150" width="190" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="585" y="176" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">Memory + world graph</text>
  <text x="585" y="198" font-size="12.5" text-anchor="middle" fill="#334155">3 memory layers</text>
  <text x="585" y="226" font-size="12" text-anchor="middle" fill="#475569">who sells what, who knows</text>
  <text x="585" y="242" font-size="12" text-anchor="middle" fill="#475569">whom (optional Neo4j)</text>

  <rect x="710" y="150" width="190" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="805" y="176" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">Context + payload</text>
  <text x="805" y="198" font-size="12.5" text-anchor="middle" fill="#334155">strict list of facts</text>
  <text x="805" y="226" font-size="12" text-anchor="middle" fill="#475569">role · price · mood style</text>
  <text x="805" y="242" font-size="12" text-anchor="middle" fill="#475569">· last reply</text>

  <!-- model and output -->
  <rect x="680" y="380" width="220" height="86" rx="10" fill="#ffffff" stroke="#e11d2e" stroke-width="1.5"/>
  <text x="790" y="406" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">Gemma-4-31B-IT</text>
  <text x="790" y="428" font-size="12.5" text-anchor="middle" fill="#334155">served on AMD GPUs · Token Factory</text>
  <text x="790" y="448" font-size="12" text-anchor="middle" fill="#475569">phrases the line, never changes state</text>

  <rect x="360" y="388" width="188" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="454" y="418" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">NPC line</text>
  <text x="454" y="438" font-size="12.5" text-anchor="middle" fill="#334155">in character, facts intact</text>

  <!-- arrows -->
  <line x1="145" y1="68" x2="145" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="205" x2="268" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="205" x2="488" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="205" x2="708" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="880" y1="260" x2="880" y2="378" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="872" y="284" font-size="12" text-anchor="end" fill="#475569">facts only</text>

  <line x1="680" y1="423" x2="550" y2="423" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- fallback: dashed route from the payload to the NPC line, skipping the model -->
  <path d="M 740 260 L 740 334 L 454 334 L 454 386" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-soft)"/>
  <text x="728" y="326" font-size="12" text-anchor="end" fill="#475569">fallback if the API is slow or down: a canned line for the NPC's mood</text>
</svg>
